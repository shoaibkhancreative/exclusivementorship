org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.enableJetifier=true

# R8 full mode gives more aggressive shrinking/obfuscation than the default
# "compat" mode. Combined with minifyEnabled+shrinkResources in
# app/build.gradle, this is the "make the APK hard to read/tamper with"
# requirement from Phase 2. See app/proguard-rules.pro for the keep-rules
# this requires.
android.enableR8.fullMode=true
